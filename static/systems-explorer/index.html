<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDI Systems Explorer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="header-actions primary-actions">
        <button id="addStockBtn" type="button">+ Node</button>
        <button id="addLinkBtn" type="button">+ Link</button>
      </div>
      <h1 class="app-title">HDI Systems Explorer</h1>
      <div class="header-actions utility-actions">
        <button id="examplesBtn" class="btn-quiet" type="button">Examples</button>
        <button id="newBtn" class="btn-quiet" type="button">New</button>
        <button id="importBtn" class="btn-quiet" type="button">Import</button>
        <button id="exportBtn" class="btn-quiet" type="button">Export</button>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">Dark</button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <svg id="diagram" aria-label="Systems diagram canvas">
        <defs>
          <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M2,2 L10,6 L2,10 Z" fill="#303744"></path>
          </marker>
          <marker id="arrowHeadRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M2,2 L10,6 L2,10 Z" fill="#bd0129"></path>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>

      <section class="floating-panel simulator-panel" id="simulatorPanel">
        <div class="panel-head">
          <div>
            <h2>Simulator</h2>
            <span>Run and inspect behavior</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="run-state" id="runStateBadge">Ready</div>
          <div class="sim-readouts">
            <div class="metric">Time <strong id="timeReadout">0.0</strong></div>
            <div class="metric">Packages <strong id="packageReadout">0</strong></div>
            <div class="metric">Step <strong id="stepReadout">0</strong></div>
          </div>
          <div class="sim-controls">
            <button id="startRunBtn" class="btn-primary" type="button">Start</button>
            <button id="pauseBtn" type="button">Pause</button>
            <button id="resetBtn" type="button">Reset</button>
            <label class="step-toggle"><input id="stepMode" type="checkbox"> Step-by-step</label>
          </div>
          <div class="speed-row" id="speedRow">
            <label>Speed <input id="speed" type="range" min="0.2" max="8" step="0.2" value="1.4"></label>
          </div>
          <div class="step-row" id="stepRow">
            <button id="prevStepBtn" type="button">Prev</button>
            <span id="currentStepLabel">Step 0</span>
            <button id="nextStepBtn" type="button">Next</button>
          </div>
          <div class="status-banner" id="statusBanner">
            <span id="statusText"><strong>Ready:</strong> edit the model or press Start to seed the first package.</span>
            <button id="continueBtn" type="button" style="display:none">Continue</button>
          </div>
          <div class="behavior-section" id="behaviorSection">
            <div class="behavior-tabs" role="group" aria-label="Behavior view">
              <button id="chartTabBtn" class="active" type="button">Chart</button>
              <button id="tableTabBtn" type="button">Step table</button>
            </div>
            <div class="chart-wrap behavior-pane active" id="chartPane">
              <svg id="historyChart" width="340" height="200" aria-label="Behavior over time chart"></svg>
            </div>
            <div class="step-table-wrap behavior-pane" id="tablePane">
              <div class="step-table-title">Step-by-step table view</div>
              <div class="step-table-scroll">
                <table class="step-table" id="stepTable"></table>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="floating-panel editor-panel" id="editorPanel">
        <div class="panel-head">
          <div>
            <h2>Property Editor</h2>
            <span id="editorSubhead">Select a stock or link</span>
          </div>
        </div>
        <div class="panel-body" id="editorBody"></div>
      </section>

      <div class="lightbox-backdrop" id="chartBackdrop"></div>
      <div class="chart-lightbox" id="chartLightbox" role="dialog" aria-modal="true" aria-label="Expanded behavior chart">
        <button id="closeChartBtn" class="icon-btn chart-close" type="button" aria-label="Close expanded chart">x</button>
        <svg id="expandedHistoryChart" aria-label="Expanded behavior over time chart"></svg>
      </div>
      <div class="toast" id="toast"></div>
      <input id="importFile" type="file" accept="application/json,.json" hidden>

      <div class="modal" id="examplesModal" role="dialog" aria-modal="true" aria-label="Example archetypes">
        <div class="modal-card">
          <div class="modal-head">
            <h2>System archetypes</h2>
            <button id="closeExamplesBtn" class="icon-btn" type="button">x</button>
          </div>
          <div class="example-grid" id="exampleGrid"></div>
        </div>
      </div>

      <div class="modal" id="startModal" role="dialog" aria-modal="true" aria-label="Start simulation">
        <div class="modal-card start-card">
          <div class="modal-head">
            <h2>Start simulation</h2>
            <button id="cancelStartBtn" class="icon-btn" type="button">x</button>
          </div>
          <div class="start-form">
            <label>Seed node <select id="startNodeSelect"></select></label>
            <label>Initial package size <input id="startAmountInput" type="number" step="1" value="20"></label>
            <div class="row-actions">
              <button id="confirmStartBtn" class="btn-primary" type="button">Send package</button>
              <button id="cancelStartFooterBtn" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
