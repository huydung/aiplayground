        // --- CUSTOM HOOKS ---
        // Reads from / writes to the server-synced DataCtx (same interface as useLocalStorage)
        function useLocalStorage(key, initialValue) {
          const { data, update } = useContext(DataCtx);
          const value = (data && key in data) ? data[key] : initialValue;
          const setValue = useCallback((v) => {
            if (v instanceof Function) {
              // Functional update: mirror the same initialValue fallback used for reads,
              // so callers like setQuizStats(s => s.by...) never receive undefined.
              update(key, prev => v(prev !== undefined ? prev : initialValue));
            } else {
              update(key, v);
            }
          }, [key, update]);
          return [value, setValue];
        }

        // --- PHYSICS CANVAS COMPONENT ---

          call:  ['💎','🔮','🧿','🌊','🦉','🧠','⚖️','🔭'],
          value: ['👑','🏆','🥇','🔥','⚡','💥','🌟','💰'],
          bluff: ['🎭','🃏','🦊','🎩','🌪️','🧙','🦅','🌑'],

        // tokens: array of { id, emoji, ... } — persistent objects from localStorage
        function TokenPhysicsArea({ tokens, onAddToken, onRemove, onShake, onTokenTap }) {
          const containerRef = useRef(null);
          const rafRef = useRef(null);
          const tokensRef = useRef([]);    // physics objects, keyed by tokenId
          const domRefs = useRef({});
          const dragRef = useRef({ id: null, lastX: 0, lastY: 0 });
          const tapRef  = useRef({ id: null, x: 0, y: 0, time: 0 });
          const [renderList, setRenderList] = useState([]);

          // Sync physics objects to tokens array by ID — preserves emojis & positions across re-renders
          useEffect(() => {
            const existingIds = new Set(tokensRef.current.map(p => p.tokenId));
            const newIds      = new Set(tokens.map(t => t.id));

            // Remove physics objects no longer in array
            tokensRef.current = tokensRef.current.filter(p => newIds.has(p.tokenId));

            // Add physics objects for new tokens
            tokens.forEach((token, index) => {
              if (!existingIds.has(token.id)) {
                const width = containerRef.current?.clientWidth || 200;
                tokensRef.current.push({
                  tokenId: token.id,
                  emoji: token.emoji,
                  index,
                  x: width / 2 + (Math.random() * 40 - 20),
                  y: -40 - (Math.random() * 20),
                  vx: Math.random() * 6 - 3,
                  vy: Math.random() * 2,
                  isDragging: false,
                });
              }
              // Update index for tier calculation
              const p = tokensRef.current.find(p => p.tokenId === token.id);
              if (p) p.index = index;
            });

            setRenderList([...tokensRef.current]);
          }, [tokens]);

          // Physics Loop
          useEffect(() => {
            const animate = () => {
              const container = containerRef.current;
              if (!container) return;
              
              const width = container.clientWidth;
              const height = container.clientHeight;
              const tokens = tokensRef.current;
              const RADIUS = 16;
              
              // Integrate forces
              tokens.forEach(t => {
                if (!t.isDragging) {
                  t.vy += 0.5; // gravity
                  
                  // Terminal velocity
                  if (t.vy > 18) t.vy = 18;
                  if (t.vx > 18) t.vx = 18;
                  if (t.vx < -18) t.vx = -18;

                  t.x += t.vx;
                  t.y += t.vy;

                  // Floor/Ceiling
                  if (t.y + RADIUS > height) { 
                    t.y = height - RADIUS; 
                    t.vy *= -0.55; // bounce
                    t.vx *= 0.92;  // friction
                  }
                  
                  // Walls
                  if (t.x - RADIUS < 0) { 
                    t.x = RADIUS; 
                    t.vx *= -0.6; 
                  }
                  if (t.x + RADIUS > width) { 
                    t.x = width - RADIUS; 
                    t.vx *= -0.6; 
                  }
                }
              });

              // Collisions
              for (let i = 0; i < tokens.length; i++) {
                for (let j = i + 1; j < tokens.length; j++) {
                  let dx = tokens[j].x - tokens[i].x;
                  let dy = tokens[j].y - tokens[i].y;
                  let dist = Math.sqrt(dx * dx + dy * dy);
                  
                  if (dist < RADIUS * 2 && dist > 0) {
                    let overlap = (RADIUS * 2) - dist;
                    let nx = dx / dist;
                    let ny = dy / dist;

                    // Separate overlapping circles
                    if (!tokens[i].isDragging) { tokens[i].x -= nx * overlap / 2; tokens[i].y -= ny * overlap / 2; }
                    if (!tokens[j].isDragging) { tokens[j].x += nx * overlap / 2; tokens[j].y += ny * overlap / 2; }

                    // Exchange momentum
                    let kx = (tokens[i].vx - tokens[j].vx);
                    let ky = (tokens[i].vy - tokens[j].vy);
                    let p = 1.3 * (nx * kx + ny * ky) / 2;
                    
                    if (p > 0) { // Only resolve if moving towards each other
                      if (!tokens[i].isDragging) { tokens[i].vx -= p * nx; tokens[i].vy -= p * ny; }
                      if (!tokens[j].isDragging) { tokens[j].vx += p * nx; tokens[j].vy += p * ny; }
                    }
                  }
                }
              }

              // Update DOM Nodes via Direct Manipulation (High Performance)
              tokens.forEach(t => {
                const el = domRefs.current[t.tokenId];
                if (el) el.style.transform = `translate(${t.x}px, ${t.y}px)`;
              });

              rafRef.current = requestAnimationFrame(animate);
            };

            rafRef.current = requestAnimationFrame(animate);
            return () => cancelAnimationFrame(rafRef.current);
          }, []);

          // Drag + Tap Interactions
          const handlePointerDown = (e, tokenId) => {
            e.preventDefault();
            const container = containerRef.current.getBoundingClientRect();
            const x = e.clientX - container.left;
            const y = e.clientY - container.top;
            tapRef.current  = { id: tokenId, x: e.clientX, y: e.clientY, time: Date.now() };
            dragRef.current = { id: tokenId, lastX: x, lastY: y };
            const p = tokensRef.current.find(p => p.tokenId === tokenId);
            if (p) { p.isDragging = true; p.vx = 0; p.vy = 0; }
          };

          const handlePointerMove = (e) => {
            if (!dragRef.current.id) return;
            const container = containerRef.current.getBoundingClientRect();
            const x = e.clientX - container.left;
            const y = e.clientY - container.top;
            const p = tokensRef.current.find(p => p.tokenId === dragRef.current.id);
            if (p) { p.vx = x - dragRef.current.lastX; p.vy = y - dragRef.current.lastY; p.x = x; p.y = y; }
            dragRef.current.lastX = x;
            dragRef.current.lastY = y;
          };

          const handlePointerUp = (e) => {
            if (!dragRef.current.id) return;
            // Distinguish short tap (< 250ms, < 10px) from drag → open detail
            const elapsed = Date.now() - tapRef.current.time;
            const dx = e.clientX - tapRef.current.x;
            const dy = e.clientY - tapRef.current.y;
            if (elapsed < 250 && Math.sqrt(dx*dx + dy*dy) < 10 && onTokenTap) {
              onTokenTap(dragRef.current.id);
            }
            const p = tokensRef.current.find(p => p.tokenId === dragRef.current.id);
            if (p) p.isDragging = false;
            dragRef.current.id = null;
          };

          // Shake — give every token a random explosive velocity
          const handleShake = () => {
            tokensRef.current.forEach(t => {
              t.vx = (Math.random() - 0.5) * 40;
              t.vy = -(Math.random() * 20 + 10);
              t.isDragging = false;
            });
          };

          // Wire external onShake prop to internal handler via ref
          useEffect(() => {
            if (onShake) onShake.current = handleShake;
          });

          // Determine CSS class based on token index — new tier every 4
          const getTokenClass = (index) => {
            const tier = Math.floor(index / 4) + 1;
            return `token-t${Math.min(tier, 7)}`;
          };

          return (
            <div className="bg-neutral-900 border border-neutral-800 rounded-xl mb-4 flex overflow-hidden shadow-inner h-[240px] select-none touch-none">
              
              {/* Physics Canvas Area (4/5 width) */}
              <div 
                className="w-4/5 relative border-r border-neutral-800 overflow-hidden bg-neutral-950" 
                ref={containerRef}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
              >
                {renderList.map((token) => (
                  <div
                    key={token.tokenId}
                    ref={el => domRefs.current[token.tokenId] = el}
                    onPointerDown={(e) => handlePointerDown(e, token.tokenId)}
                    className="absolute left-0 top-0 w-8 h-8 cursor-grab active:cursor-grabbing will-change-transform z-10"
                    style={{ marginLeft: '-16px', marginTop: '-16px' }}
                  >
                    <div className={`w-full h-full rounded-full flex items-center justify-center transition-colors duration-200 ${getTokenClass(token.index)}`}>
                      <span className="text-base leading-none select-none" style={{filter:'drop-shadow(0 0 4px rgba(255,255,255,0.3))'}}>{token.emoji}</span>
                    </div>
                  </div>
                ))}
              </div>

              {/* Control Panel (1/5 width) */}
              <div className="w-1/5 bg-neutral-900 flex flex-col justify-center items-center py-2 z-20 shadow-[-5px_0_15px_rgba(0,0,0,0.5)]">
                <button
                  onClick={onAddToken}
                  className="flex-1 w-full flex items-center justify-center text-yellow-500 hover:bg-neutral-800 active:bg-neutral-700 active:scale-95 transition-all"
                >
                  <Plus size={28} />
                </button>
                <div className="py-1 flex flex-col items-center gap-1">
                  <div className="text-3xl font-mono font-black text-yellow-500 leading-none">{tokens.length}</div>
                  <button
                    onClick={() => onShake && onShake.current && onShake.current()}
                    title="Shake!"
                    className="text-neutral-500 hover:text-yellow-500 active:scale-90 transition-all text-base leading-none"
                  >
                    💥
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // --- MAIN APP COMPONENT ---
        function App({ username, onLogout }) {
          const { data: ctxData, replaceAll } = useContext(DataCtx);
          // Global State
          const [hands, setHands] = useLocalStorage('pt2_hands', []);
          const [sessions, setSessions] = useLocalStorage('pt2_sessions', []);
          const [discTokensRaw, setDiscTokens] = useLocalStorage('pt2_disc', []);
          // Migrate old number format → array of token objects
          const discTokens = Array.isArray(discTokensRaw) ? discTokensRaw : [];
          useEffect(() => { if (!Array.isArray(discTokensRaw)) setDiscTokens([]); }, []);
          const [startTime, setStartTime] = useLocalStorage('pt2_start', Date.now());
          const [commOpen, setCommOpen] = useLocalStorage('pt2_comm', true);
          // Miracle budget is derived: starts at 1, gains 1 per 8 discipline tokens earned
          const miracleBudget = 1 + Math.floor(discTokens.length / 8);
          
          // Navigation State
          const [activeTab, setActiveTab] = useState('session'); // 'session', 'add', 'history', 'sessions', 'stats'
          const [editingHandId, setEditingHandId] = useState(null);

          // Quiz state lifted here so it survives tab switches
          const [quizQ, setQuizQ] = useState(() => generateQuestion('All'));
          const [quizSelected, setQuizSelected] = useState(null);
          const [quizCatFilter, setQuizCatFilter] = useState('All');
          
          // Toast State
          const [toastMsg, setToastMsg] = useState('');

          const showToast = (msg) => {
            setToastMsg(msg);
            setTimeout(() => setToastMsg(''), 2500);
          };

          // --- HELPERS ---
          const clearAllData = () => {
            if (window.confirm('Clear ALL data including all sessions? Cannot be undone.')) {
              setHands([]);
              setSessions([]);
              setDiscTokens([]);
              setStartTime(Date.now());
              showToast('All data cleared');
            }
          };

          const endSession = (pnl) => {
            const total = hands.length;
            const played = hands.filter(h => h.isVPIP).length;
            const vpip = total > 0 ? Math.round((played / total) * 100) : 0;
            const handsSorted = [...hands].sort((a, b) => (a.ts || 0) - (b.ts || 0));
            const firstTs = handsSorted.length > 0 ? handsSorted[0].ts : startTime;
            const lastTs  = handsSorted.length > 0 ? handsSorted[handsSorted.length - 1].ts : Date.now();
            const newStartTime = Date.now();

            const newSession = {
              id: startTime,
              date: new Date(firstTs).toLocaleDateString(),
              dateMs: firstTs,
              firstTs,
              lastTs,
              hands: [...hands],
              totalHands: total,
              vpip,
              played,
              pnl: parseFloat(pnl) || 0,
              discTokens: discTokens.length
            };

            // Save the whole new state at once (immediate, concurrency-checked) AND keep a
            // restorable Session-End snapshot. replaceAll updates the shared data, so the derived
            // hands/sessions/etc. below re-render from it — no separate per-key setters needed.
            const pnlStr = `${newSession.pnl >= 0 ? '+' : ''}${newSession.pnl}`;
            const snapLabel = `${newSession.date} · ${total} hand${total === 1 ? '' : 's'} · ${pnlStr}`;
            replaceAll({
              ...ctxData,
              pt2_sessions: [newSession, ...sessions],
              pt2_hands: [],
              pt2_disc: [],
              pt2_start: newStartTime,
            }, { snapshot: snapLabel });

            setActiveTab('session');
            showToast('Session saved!');
          };

          const renderScreen = () => {

              case 'session':

                  hands={hands} discTokens={discTokens} setDiscTokens={setDiscTokens}
                  startTime={startTime} commOpen={commOpen} setCommOpen={setCommOpen}
                  navigate={setActiveTab} endSession={endSession}
                  onAddHand={() => { setEditingHandId(null); setActiveTab('add'); }}

                }
                @keyframes chaos {
                  0%   { background:#fff; border-color:#fff; color:#000; transform:scale(1.25); box-shadow:0 0 40px #fff; }
                  25%  { background:#f00; border-color:#fca5a5; color:#fff; transform:scale(0.9) rotate(10deg); box-shadow:0 0 30px #f00; }
                  50%  { background:#a855f7; border-color:#d8b4fe; color:#fff; transform:scale(1.2); box-shadow:0 0 35px #a855f7; }
                  75%  { background:#22c55e; border-color:#86efac; color:#000; transform:scale(1) rotate(-8deg); box-shadow:0 0 30px #22c55e; }
                  100% { background:#fff; border-color:#fff; color:#000; transform:scale(1.25); box-shadow:0 0 40px #fff; }
                }
                /* Tier 1 (1-4): Spark — dim glow, still */
                .token-t1 { background:rgba(234,179,8,0.15); border:1px solid rgba(234,179,8,0.3); color:rgba(234,179,8,0.55); }
                /* Tier 2 (5-8): Warming — gentle breathe */
                .token-t2 { background:rgba(234,179,8,0.28); border:1px solid rgba(234,179,8,0.65); color:#eab308; animation:breathe 2.5s ease-in-out infinite; }
                /* Tier 3 (9-12): Focused — solid gold pulse */
                .token-t3 { background:#ca8a04; border:1px solid #fef08a; color:#fefce8; font-weight:bold; animation:pulseMed 1.5s ease-in-out infinite; }
                /* Tier 4 (13-16): Sharp — bright fast pulse */
                .token-t4 { background:#eab308; border:2px solid #fef08a; color:#422006; font-weight:900; animation:pulseFast 0.75s ease-in-out infinite; }
                /* Tier 5 (17-20): Elite — gold↔purple shift */
                .token-t5 { border-width:2px; font-weight:900; animation:goldPurple 0.65s ease-in-out infinite; }
                /* Tier 6 (21-24): Legendary — full rainbow */
                .token-t6 { border-width:2px; color:#fff; font-weight:900; animation:rainbow 1.2s linear infinite; }
                /* Tier 7 (25+): UNTOUCHABLE — chaos */
                .token-t7 { border-width:2px; font-weight:900; animation:chaos 0.18s step-start infinite; }
              `}</style>

              <div className="w-full max-w-md bg-neutral-950 flex flex-col min-h-screen relative shadow-2xl border-x border-neutral-900">

                {/* User badge */}
                <div className="absolute top-3 right-3 z-30 flex items-center gap-2 text-[11px] text-neutral-600">

        // --- SCREEN: SESSION (DASHBOARD) ---

          const handleEndSession = () => {

          return (
            <div className="flex flex-col h-full overflow-hidden">
              {/* Header */}
              <div className="px-5 pt-12 pb-4 border-b border-neutral-800/50 bg-neutral-950 sticky top-0 z-10 flex justify-between items-center">
                <div>
                  <h1 className="text-lg font-medium text-white">Poker Tracker</h1>

                <button onClick={() => setShowEndModal(true)} className="px-3 py-1.5 rounded-md border border-neutral-700 bg-neutral-800 text-xs font-medium text-neutral-300 hover:bg-neutral-700 active:scale-95 transition-all">

                </button>
              </div>

              <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 pb-12">
                {/* Commitments */}
                <div className="mb-4 rounded-xl border border-yellow-500/30 bg-gradient-to-br from-yellow-500/10 to-transparent relative overflow-hidden">
                  <div className="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-yellow-500 to-yellow-500/20"></div>
                  <button onClick={() => setCommOpen(!commOpen)} className="w-full flex items-center justify-between p-3">
                    <span className="text-[10px] font-bold uppercase tracking-widest text-yellow-500">My Commitments</span>
                    {commOpen ? <ChevronUp size={16} className="text-neutral-400" /> : <ChevronDown size={16} className="text-neutral-400" />}

                  {commOpen && (
