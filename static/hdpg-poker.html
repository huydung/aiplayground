        // --- DATA PROVIDER — fetches + syncs user state to server, caches in localStorage ---
        // Concurrency model: the server keeps a monotonic revision (_rev). Every write carries
        // the rev it was based on, and the server rejects (409) any write based on an older rev.
        // This is what prevents a STALE client — an old/backgrounded Safari tab, a bfcache
        // restore, or the load-time cache seed — from silently overwriting newer data, which was
        // the root cause of the recurring "my saved session reverted to an old one" data loss.
        function DataProvider({ token, onLogout, children }) {
          // localStorage key is per-user so multiple accounts on the same device don't mix
          const lsKey = `poker_data_${(() => { try { return JSON.parse(atob(token.split('.')[1])).id; } catch(_) { return '0'; } })()}`;

          // Seed UI instantly from the local cache so the app is usable while the server wakes up.
          // Cached data is DISPLAYED but never SYNCED until we learn the server's current rev.
          const cached = (() => { try { const c = safeStorage.get(lsKey); return c ? JSON.parse(c) : null; } catch(_) { return null; } })();
          const [data, setData] = useState(cached);
          const [offlineMode, setOfflineMode] = useState(false);
          const [retryKey, setRetryKey] = useState(0);

          const syncTimer = useRef(null);
          const latestDataRef = useRef(cached); // freshest data, for flush-on-close
          const revRef = useRef(null);          // server rev this client is based on (null = not loaded)
          const loadedRef = useRef(false);      // true once the initial server fetch has resolved
          const dirtyRef = useRef(false);       // true while the user has unsaved local changes

          const writeCache = useCallback((d) => { safeStorage.set(lsKey, JSON.stringify(d)); }, [lsKey]);

          // Adopt server state as the truth (on load, on focus-refetch, or on a 409 conflict).
          const adoptServer = useCallback((server) => {
            const { _rev, ...clean } = server || {};
            revRef.current = (typeof _rev === 'number') ? _rev : 0;
            latestDataRef.current = clean;
            dirtyRef.current = false;
            setData(clean);
            writeCache(clean);
          }, [writeCache]);

          // Low-level PUT with optimistic concurrency. keepalive so it survives page close.
          // opts.snapshot (a label string) asks the server to keep a restorable Session-End snapshot.
          const putData = useCallback((d, opts = {}) => {
            // Never sync before we know the server rev — a pre-load write could be stale and clobber.
            if (!loadedRef.current || revRef.current === null) return;
            const body = { ...d, _rev: revRef.current };
            if (opts.snapshot) body._snapshot = opts.snapshot;
            fetch('/api/poker/data', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
              body: JSON.stringify(body),
              keepalive: true,
            })
              .then(async (r) => {
                if (r.status === 409) {
                  // Server has newer data than ours — do NOT clobber it. Adopt it, drop our write.
                  const server = await r.json().catch(() => ({}));
                  adoptServer(server);
                  setOfflineMode(false);
                  return;
                }
                if (r.status === 401) { onLogout(); return; }
                if (!r.ok) throw new Error(r.status);
                const body = await r.json().catch(() => ({}));
                if (typeof body._rev === 'number') revRef.current = body._rev;
                dirtyRef.current = false;
                setOfflineMode(false);
              })
              .catch(console.error);
          }, [token, adoptServer, onLogout]);

          // Fetch from server (source of truth). Runs on mount, token change, and focus-refetch.
          useEffect(() => {
            setOfflineMode(false);
            fetch('/api/poker/data', { headers: { Authorization: `Bearer ${token}` } })
              .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
              .then(server => {
                // Always adopt the server on (re)load. Pre-load cache edits are intentionally
                // discarded — keeping them is exactly how a stale snapshot used to win.
                adoptServer(server);
                loadedRef.current = true;
              })
              .catch(err => {
                if (String(err.message) === '401') { onLogout(); return; }
                setOfflineMode(true); // cached data (if any) still shown; writes stay gated
              });
          }, [token, retryKey]);

          const scheduleSync = useCallback((newData) => {
            clearTimeout(syncTimer.current);
            syncTimer.current = setTimeout(() => { syncTimer.current = null; putData(newData); }, 800);
          }, [putData]);

          // Immediate flush — cancel debounce, write localStorage + server right now
          const flush = useCallback((overrideData) => {
            clearTimeout(syncTimer.current);
            syncTimer.current = null;
            const toSave = overrideData ?? latestDataRef.current;
            if (toSave == null) return;
            latestDataRef.current = toSave;
            writeCache(toSave);
            putData(toSave);
          }, [putData, writeCache]);

          const update = useCallback((key, valueOrFn) => {
            setData(prev => {
              const base = prev || {};
              const next = { ...base, [key]: valueOrFn instanceof Function ? valueOrFn(base[key]) : valueOrFn };
              latestDataRef.current = next;
              dirtyRef.current = true;
              writeCache(next);   // immediate local backup (always safe)
              scheduleSync(next); // debounced server sync (gated inside putData until loaded)
              return next;
            });
          }, [scheduleSync, writeCache]);

          // Replace the entire data blob at once (used by Session End and snapshot Restore).
          const replaceAll = useCallback((newData, opts = {}) => {
            const clean = { ...(newData || {}) };
            ['_rev', '_snapshot', '_snapshotRev', '_label', '_createdAt'].forEach(k => delete clean[k]);
            latestDataRef.current = clean;
            dirtyRef.current = true;
            setData(clean);
            writeCache(clean);
            clearTimeout(syncTimer.current);
            syncTimer.current = null;
            putData(clean, opts); // immediate save (carries snapshot flag when requested)
          }, [putData, writeCache]);

          // Session-End snapshot access (list + fetch one) for the in-app Restore UI
          const listSnapshots = useCallback(() =>
            fetch('/api/poker/snapshots', { headers: { Authorization: `Bearer ${token}` } })
              .then(r => r.ok ? r.json() : []), [token]);
          const getSnapshot = useCallback((id) =>
            fetch(`/api/poker/snapshots/${id}`, { headers: { Authorization: `Bearer ${token}` } })
              .then(r => { if (!r.ok) throw new Error('Snapshot not found'); return r.json(); }), [token]);

          // Save pending changes when the page is hidden/closed; refresh when it returns to the
          // foreground or is restored from bfcache, so a long-lived/backgrounded tab re-syncs to
          // the latest data instead of pushing a stale snapshot.
          useEffect(() => {
            const onVisChange = () => {
              if (document.visibilityState === 'hidden') {
                if (syncTimer.current) flush();
              } else if (!dirtyRef.current) {
                setRetryKey(k => k + 1); // refresh (only when we have no unsaved edits)
              }
            };
            const onPageHide = () => { if (syncTimer.current) flush(); };
            const onPageShow = (e) => { if (e.persisted && !dirtyRef.current) setRetryKey(k => k + 1); };
            window.addEventListener('pagehide', onPageHide);
            window.addEventListener('pageshow', onPageShow);
            document.addEventListener('visibilitychange', onVisChange);
            return () => {
              window.removeEventListener('pagehide', onPageHide);
              window.removeEventListener('pageshow', onPageShow);
              document.removeEventListener('visibilitychange', onVisChange);
            };
          }, [flush]);

          const ctxValue = useMemo(() => ({ data: data ?? {}, update, flush, replaceAll, listSnapshots, getSnapshot }),
            [data, update, flush, replaceAll, listSnapshots, getSnapshot]);

          // No cache + server unreachable → show retry screen
          if (data === null && offlineMode) {
            return (
              <div className="flex flex-col items-center justify-center min-h-screen bg-neutral-950 gap-4 p-8 text-center">
                <div className="text-neutral-400 text-sm">Connection error — server may be starting up.</div>
                <button
                  onClick={() => setRetryKey(k => k + 1)}
                  className="px-5 py-2 bg-neutral-800 border border-neutral-700 text-neutral-300 rounded-xl text-sm hover:bg-neutral-700 active:scale-95 transition-all"
                >
                  Retry
                </button>
              </div>
            );
          }

          // No cache yet, waiting for server → spinner
          if (data === null) {
            return (
              <div className="flex items-center justify-center min-h-screen bg-neutral-950 text-neutral-500 text-sm">
                Loading…
              </div>
            );
          }

          return (
            <DataCtx.Provider value={ctxValue}>
              {offlineMode && (
                <div className="fixed top-0 inset-x-0 z-50 bg-orange-500 text-black text-xs text-center py-1.5 font-semibold">
                  Offline — showing cached data.{' '}
                  <button onClick={() => setRetryKey(k => k + 1)} className="underline">Retry</button>
                </div>
              )}
              {children}
            </DataCtx.Provider>
          );
        }

        // --- APP ROOT — orchestrates auth flow ---
        function AppRoot() {
          const [token, setToken] = useState(() => safeStorage.get('poker_token'));
          const [username, setUsername] = useState(() => safeStorage.get('poker_user'));

          const handleAuth = useCallback((token, username) => {
            safeStorage.set('poker_token', token);
            safeStorage.set('poker_user', username);
            setToken(token);
            setUsername(username);
          }, []);

          const handleLogout = useCallback(() => {
            safeStorage.remove('poker_token');
            safeStorage.remove('poker_user');
            setToken(null);
            setUsername(null);
          }, []);

          if (!token) return <AuthScreen onAuth={handleAuth} />;

          return (
            <DataProvider token={token} onLogout={handleLogout}>
              <App username={username} onLogout={handleLogout} />
            </DataProvider>
          );
        }

        // --- RENDER APP ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppRoot />);
    </script>
</body>
