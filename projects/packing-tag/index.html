<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Packing Tag Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a luggage-tag header with a scale gauge, then planner form (left) beside the live, weight-fitted list (right); Pack view is a full-width checklist with a tick per traveller. */
:root{
  --bg:#E9EEEC; --surface:#FFFFFF; --sunk:#DDE5E2; --ink:#15303A; --muted:#566C72; --line:#C9D4D1;
  --accent:#D4521C; --accent-ink:#FFFFFF; --accent-soft:#F7E1D6;
  --ok:#2B7A4B; --warn:#A86B12; --over:#BE3328;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181C; --surface:#15242A; --sunk:#1C2E35; --ink:#E2EBE9; --muted:#93A7AB; --line:#2B3E45;
  --accent:#F07B45; --accent-ink:#1A0C05; --accent-soft:#3A2419; --ok:#5DC08A; --warn:#E2A94C; --over:#F26C5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181C; --surface:#15242A; --sunk:#1C2E35; --ink:#E2EBE9; --muted:#93A7AB; --line:#2B3E45;
  --accent:#F07B45; --accent-ink:#1A0C05; --accent-soft:#3A2419; --ok:#5DC08A; --warn:#E2A94C; --over:#F26C5E; color-scheme:dark}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- tag header ---------- */
.top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:stretch}
.tag{position:relative;background:var(--surface);color:var(--ink);padding:18px 22px 18px 58px;
  clip-path:polygon(30px 0,100% 0,100% 100%,30px 100%,0 calc(100% - 30px),0 30px);
  display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:16px}
.tag::before{content:"";position:absolute;left:20px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px var(--line)}
.tag .barcode{background:repeating-linear-gradient(180deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 13px,transparent 13px 15px);opacity:.85;border-radius:2px}
.route{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,8vw,76px);line-height:.9;letter-spacing:.02em;display:flex;align-items:center;gap:.25em;flex-wrap:wrap}
.route .arrow{color:var(--accent);font-size:.6em}
.tagmeta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px}
.tagmeta div{display:grid;gap:2px}
.tagmeta b{font:500 13px/1.3 var(--f-mono)}
.example{margin-top:12px;font-size:13px;color:var(--accent);font-weight:600}

.scale{background:var(--surface);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px;align-content:start}
.scale .read{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.scale .big{font:700 44px/1 var(--f-display)}
.gauge{position:relative;height:22px;background:var(--sunk);border-radius:4px;overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--ok);transition:width .3s}
.gauge .ticks{position:absolute;inset:0;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);opacity:.9}
.gauge.warn .fill{background:var(--warn)} .gauge.over .fill{background:var(--over)}
.scale small{color:var(--muted);font-size:13px}
.state-ok{color:var(--ok)} .state-warn{color:var(--warn)} .state-over{color:var(--over)}

.tabs{display:flex;gap:4px;margin:22px 0 16px;border-bottom:2px solid var(--line);flex-wrap:wrap;align-items:flex-end}
.tabs button{background:none;border:0;padding:10px 16px;font:700 20px/1 var(--f-display);letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.tabs .sync{margin-left:auto;font-size:12px;color:var(--muted);padding:0 0 10px}

/* ---------- plan layout ---------- */
.plan{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:24px;align-items:start}
form.trip{display:grid;gap:14px}
fieldset{border:0;margin:0;padding:16px;background:var(--surface);border-radius:var(--r);display:grid;gap:12px;min-width:0}
legend{float:left;width:100%;padding:0;font:700 22px/1 var(--f-display);margin-bottom:2px}
.field{display:grid;gap:5px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=text],input[type=date],input[type=number],select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
select{padding:7px 8px;font-size:14px}
input[type=number]{font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:var(--bg);user-select:none}
.chips input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chips.lug span{border-radius:7px}
.chips.sm span{padding:4px 9px;font-size:12.5px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--over)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--ink);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}

/* travellers */
.people{display:grid;gap:10px}
.person{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.person .phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.person .phead input{background:var(--surface);font-weight:600}
.person select{background:var(--surface)}
.person .chips span{background:var(--surface)}
.person details summary{cursor:pointer;font-size:13.5px;font-weight:600}
.person details[open] summary{margin-bottom:8px}
.xbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--muted)}
.addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.count{font:500 13px var(--f-mono);color:var(--muted)}

/* weather */
.climate{border-left:3px solid var(--accent);padding:10px 12px;background:var(--bg);border-radius:0 7px 7px 0;font-size:14px;display:grid;gap:8px}
.climate ul{margin:0;padding-left:18px}
.wx{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.wx div{background:var(--surface);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.wx b{font:600 18px/1.1 var(--f-display);letter-spacing:.02em}
.wx small{font:500 11.5px var(--f-mono);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 12.5px/1.4 var(--f-mono);color:var(--muted)}
details.adjust summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
details.adjust[open]{display:grid;gap:10px}

/* ---------- review list ---------- */
.listhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.listhead h2{font-size:30px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.group{background:var(--surface);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.group h3{font-size:19px;padding:12px 16px 8px;display:flex;justify-content:space-between;gap:10px}
.group h3 .mono{font:500 12.5px var(--f-mono);color:var(--muted);align-self:center}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto 64px auto;gap:6px 10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
.item label{min-width:0;cursor:pointer}
.item .why{display:block;font-size:12.5px;color:var(--muted)}
.item .who{display:block;font:500 12px/1.4 var(--f-mono);color:var(--ink);opacity:.8}
.item .wt{font:500 12.5px var(--f-mono);text-align:right;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{background:none;border:0;width:24px;height:24px;line-height:1}
.qty output{min-width:22px;text-align:center;font:500 13px var(--f-mono)}
.pri{font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;padding:4px 6px;border-radius:4px;white-space:nowrap}
.p1{background:var(--ink);color:var(--surface)} .p2{background:var(--sunk);color:var(--ink)} .p3{border:1px solid var(--line);color:var(--muted)}
.item.off label,.item.nofit label{color:var(--muted)}
.item.off .name{text-decoration:line-through}
.item.nofit{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sunk) 8px 9px)}
.flag{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--over)}
.wear,.shared{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ok)}
.shared{color:var(--muted)}
.addown{display:grid;grid-template-columns:minmax(0,1fr) 150px 70px auto;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.del{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}
.confirmbar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

/* ---------- pack view ---------- */
.packtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.packtools select{width:auto}
.progress{flex:1 1 220px;display:grid;gap:6px}
.progress .bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.packgrid{columns:3 300px;column-gap:14px}
.packgrid .group{break-inside:avoid;display:inline-block;width:100%}
.pk{display:grid;gap:6px;padding:8px 16px;border-top:1px solid var(--line)}
.pk .line{display:flex;gap:10px;align-items:flex-start}
.pk .line label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1;min-width:0}
.pk input{width:20px;height:20px;accent-color:var(--ok);margin:1px 0 0;flex:none}
.pk.done .nm{color:var(--muted);text-decoration:line-through}
.pk .q{margin-left:auto;font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.pk .ticks{display:flex;flex-wrap:wrap;gap:6px;padding-left:30px}
.pk .ticks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;cursor:pointer}
.pk .ticks input{width:16px;height:16px;margin:0}
.pk .ticks label.on{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.empty{padding:28px;background:var(--surface);border-radius:var(--r);color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

@media (max-width:980px){.plan{grid-template-columns:minmax(0,1fr)}.top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .tag{padding-left:46px}.tag::before{left:14px}
  .item{grid-template-columns:22px minmax(0,1fr) auto;}
  .item .wt{grid-column:2}.item .pri{grid-column:3;justify-self:end}
  .addown{grid-template-columns:1fr 1fr}.addown input[type=text]{grid-column:1/-1}
  .row3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .tabs,.packtools,.scale,.confirmbar,#planView{display:none!important}
  #packView{display:block!important}
  body{background:#fff;color:#000}
  .group{border:1px solid #999;background:#fff}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="tag" aria-label="Trip summary">
      <div style="min-width:0">
        <div class="label">Packing tag</div>
        <div class="route" id="route"></div>
        <div class="tagmeta" id="tagmeta"></div>
        <div class="example" id="exampleNote" hidden>Example trip. Change any answer below and the list rebuilds; your trip is saved as you go.</div>
      </div>
      <div class="barcode" aria-hidden="true"></div>
    </div>
    <div class="scale" aria-live="polite">
      <div class="label">Luggage scale · whole group</div>
      <div class="read"><span class="big mono" id="kgUsed">0.0</span><span class="mono" id="kgCap">/ 0 kg</span></div>
      <div class="gauge" id="gauge"><div class="fill" id="gaugeFill"></div><div class="ticks" id="ticks"></div></div>
      <small id="scaleNote"></small>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabPlan" aria-selected="true">Plan &amp; review</button>
    <button role="tab" id="tabPack" aria-selected="false">Pack</button>
    <span class="sync" id="sync">Saved on this device</span>
  </nav>

  <section id="planView" class="plan">
    <form class="trip" id="trip" autocomplete="off"></form>
    <div>
      <div class="listhead">
        <h2>Suggested list</h2>
        <div class="legend"><span><span class="pri p1">Essential</span> always packed</span><span><span class="pri p2">Recommended</span> packed if it fits</span><span><span class="pri p3">Optional</span> fills spare weight</span></div>
      </div>
      <div id="review"></div>
      <div class="confirmbar">
        <button class="btn ghost" type="button" id="resetOv">Reset my changes</button>
        <button class="btn accent" type="button" id="confirm">Confirm list and start packing</button>
      </div>
    </div>
  </section>

  <section id="packView" hidden>
    <div class="packtools">
      <div class="progress"><div class="label" id="progLabel"></div><div class="bar"><i id="progBar"></i></div></div>
      <label class="check" for="packWho">Show</label>
      <select id="packWho" aria-label="Show items for"></select>
      <label class="check"><input type="checkbox" id="hidePacked"> Hide packed</label>
      <button class="btn ghost" type="button" id="copyText">Copy as text</button>
      <button class="btn ghost" type="button" id="dlPrint">Download printable list</button>
      <button class="btn ghost" type="button" id="untick">Untick all</button>
    </div>
    <p class="note" id="packNote"></p>
    <div class="packgrid" id="packList"></div>
  </section>
</div>

<script>
/* ================= options ================= */
const OPT = {
  purpose:[['business','Business meetings'],['conference','Conference or expo'],['leisure','Holiday / sightseeing'],['city','City break'],['beach','Beach'],['hike','Hiking or trekking'],['ski','Ski or snow'],['camping','Camping'],['study','Study or exam'],['competition','Competition or tournament'],['wedding','Wedding or formal event'],['family','Visiting family'],['backpack','Backpacking'],['cruise','Cruise'],['religious','Pilgrimage or temple visits'],['remote','Remote work']],
  transport:[['flight','Flight'],['longhaul','Long-haul flight (6 h+)'],['bus','Train or bus'],['car','Car or road trip'],['cruise','Ship or cruise']],
  stay:[['hotel','Hotel'],['apartment','Apartment / rental'],['hostel','Hostel'],['family','Family or friends'],['camping','Tent or cabin']],
  rain:[['dry','Mostly dry'],['some','Some showers'],['wet','Rainy']],
  humidity:[['low','Dry air'],['moderate','Moderate'],['high','Humid']],
  uv:[['low','Low (0–2)'],['moderate','Moderate (3–5)'],['high','High (6–7)'],['extreme','Very high (8+)']],
  style:[['light','Minimalist'],['balanced','Balanced'],['prepared','Prepared for anything']],
  age:[['adult','Adult'],['teen','Teen 13–17'],['child','Child 3–12'],['baby','Baby 0–2']],
  wardrobe:[['few','Few outfits, re-wear'],['some','Some variety'],['lots','Lots of options']],
  grooming:[['basic','Basic grooming'],['skincare','Full skincare'],['makeup-light','Light makeup'],['makeup-full','Full makeup']],
  hair:[['short','Short hair'],['long','Long hair']],
  needs:[['phone','Phone'],['money','Carries money and cards'],['laptop','Work laptop'],['shave','Shaving'],['contacts','Contact lenses'],['glasses','Glasses'],['meds','Prescription medicine'],['period','Period products'],['sleeper','Light sleeper'],['gym','Gym or running'],['swim','Swimming'],['photo','Photography'],['reading','Reading'],['gaming','Gaming'],['motion','Motion sickness'],['styling','Hair dryer / styling tools'],['watch','Smartwatch'],['coffee','Own coffee or tea']]
};
// Allowance per traveller with a seat. tare = typical weight of that traveller's empty bags.
const LUG = {
  personal:{label:'Personal item only (4 kg)',kg:4,tare:.6,cabin:true},
  cabin:{label:'Cabin bag (7 kg)',kg:7,tare:2.2,cabin:true},
  cabinplus:{label:'Cabin bag + personal item (10 kg)',kg:10,tare:2.8,cabin:true},
  chk20:{label:'Checked 20 kg + cabin 7 kg',kg:27,tare:5.7},
  chk23:{label:'Checked 23 kg + cabin 7 kg',kg:30,tare:6},
  two:{label:'2 × checked 23 kg + cabin 7 kg',kg:53,tare:10},
  custom:{label:'Custom total for the group',kg:0,tare:0}
};
OPT.luggage=Object.entries(LUG).map(([k,v])=>[k,v.label]);
const CATS = {docs:'Documents & money',clo:'Clothing',sho:'Shoes',toi:'Toiletries & grooming',med:'Health',ele:'Electronics',wrk:'Work & study',act:'Activities & gear',kid:'Babies & children',com:'Comfort & organisation',ext:'For this destination',own:'Your own items'};
const PRI = {1:'Essential',2:'Recommended',3:'Optional'};

/* ================= item catalog =================
   [scope, id, name, category, grams per unit, priority 1-3, quantity, include-when, why, {wear|free}]
   scope 'p' = one per traveller (evaluated for each person with their age, needs and activities);
   scope 's' = shared by the whole group (evaluated once with group totals).
   name/grams/priority/qty/why may be functions of the context c. */
const has=(s,...k)=>k.some(x=>s.has(x));
const W=g=>c=>Math.round(g*c.wf);            // clothing weight scaled by body size
const C = [
 // documents & money
 ['p','passport','Passport (6+ months validity left)','docs',40,1,1,c=>c.intl,'Required for every traveller, babies included'],
 ['p','visa','Visa or entry approval','docs',10,1,1,c=>c.intl,'Check the entry rules for each nationality'],
 ['p','passcopy','Passport copy and spare photos','docs',10,2,1,c=>c.intl,'Speeds up a replacement if lost'],
 ['p','idcard','National ID card','docs',10,1,1,c=>!c.intl&&c.grown,'Hotels and domestic flights ask for it'],
 ['p','wallet','Wallet','docs',120,1,1,c=>c.F.has('money')],
 ['p','cards','Two payment cards on different networks','docs',10,1,1,c=>c.F.has('money'),'A backup if one card is blocked'],
 ['p','pocketcard','Contact card in their pocket (guardian phone, hotel address)','docs',5,1,1,c=>c.minor&&!c.baby,'If they get separated from the group'],
 ['p','bizcards','Business cards','docs',60,2,1,c=>c.biz],
 ['p','eventdocs','Event registration, invitation or entry pass','docs',10,1,1,c=>has(c.P,'conference','competition','wedding')],
 ['p','studentdocs','Student ID, admission letter and transcripts','docs',30,1,1,c=>c.P.has('study')],
 ['s','tickets','Tickets and boarding passes for everyone (offline copy)','docs',0,1,1,true,'Saved offline in case there is no signal'],
 ['s','bookings','Accommodation confirmations and addresses','docs',0,1,1,c=>c.stay!=='family','Show the address to taxi drivers'],
 ['s','insurance','Travel insurance policy covering everyone','docs',0,1,1,c=>c.intl,'Medical bills abroad can be large'],
 ['s','cash',c=>'Local cash'+(c.currency?' ('+c.currency+')':''),'docs',20,1,1,c=>c.intl,'For taxis, markets and tips on arrival'],
 ['s','license','Driving licence for each driver','docs',10,1,1,c=>c.T.has('car')&&c.na>0],
 ['s','idp','International Driving Permit for each driver','docs',10,1,1,c=>c.T.has('car')&&c.intl&&c.na>0,'Many countries require it with the licence'],
 ['s','minordocs','Birth certificates or guardianship papers for the children','docs',20,1,1,c=>c.minors>0&&c.na>0&&c.intl,'Some borders ask for proof of guardianship'],

/* ================= state ================= */
const KEY='packing-tag-v2';
let pidSeq=0;
const newPerson=(age,i)=>({pid:'t'+Date.now().toString(36)+(pidSeq++),name:'',age,
  wardrobe:'some',grooming:'basic',hair:'short',needs:age==='adult'?['phone','money']:age==='teen'?['phone']:[],skip:[]});
const defaults=()=>({
  v:2, example:true, view:'plan', savedAt:0,
  people:[{...newPerson('adult'),name:'Adult 1',needs:['phone','money','laptop']},{...newPerson('adult'),name:'Adult 2',needs:['phone','money'],hair:'long',grooming:'skincare'},{...newPerson('child'),name:'Child 1'}],
  trip:{dest:'Tokyo, Japan',home:'Hanoi, Vietnam',start:'2026-11-20',end:'2026-11-26',intl:true,
    low:9,high:17,rain:'some',snow:false,humidity:'moderate',uv:'moderate',
    purpose:['leisure','city'],transport:['flight'],stay:'hotel',gifts:false,luggage:'chk23',kg:40,laundry:false,style:'balanced',
    climate:{for:'Tokyo, Japan|2026-11-20|2026-11-26',code:'TYO',homeCode:'HAN',plug:'Type A/B',voltage:'100 V',currency:'JPY',
      source:'Example values',summary:'Cool, mostly clear late-November days with occasional showers.',lowC:9,highC:17,rainPct:25,humidityPct:63,uvIndex:3,tips:[],extras:[]}},
  ov:{}, custom:[], confirmed:null, packed:{}, hidePacked:false, packWho:'all'
});
function merge(s){const d=defaults();return {...d,...s,trip:{...d.trip,...(s.trip||{})},people:Array.isArray(s.people)&&s.people.length?s.people:d.people};}
let state=defaults();
try{const raw=localStorage.getItem(KEY); if(raw) state=merge(JSON.parse(raw));}catch(e){}

/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const R=(f,c)=>typeof f==='function'?f(c):f;
const kg=g=>(g/1000).toFixed(g>=10000?0:1);
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'item';
const code=s=>String(s||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'???';
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const fmtD=s=>{const d=new Date(s+'T00:00');return isNaN(d)?'—':d.getDate()+' '+MON[d.getMonth()];};
const climateKey=t=>t.dest+'|'+t.start+'|'+t.end;
const label=(k,v)=>OPT[k].find(o=>o[0]===v)?.[1]||v;
const pname=(p,i)=>p.name?.trim()||label('age',p.age).split(' ')[0]+' '+(i+1);
function groupSummary(){
  const n={adult:0,teen:0,child:0,baby:0}; state.people.forEach(p=>n[p.age]++);
  const w={adult:['adult','adults'],teen:['teen','teens'],child:['child','children'],baby:['baby','babies']};
  return Object.keys(n).filter(k=>n[k]).map(k=>n[k]+' '+w[k][n[k]>1?1:0]).join(' · ')||'Nobody yet';
}

function lug(t,seats){
  if(t.luggage!=='custom'){const L=LUG[t.luggage]||LUG.chk23; return {...L,capKg:(L.kg-L.tare)*seats,tareKg:L.tare*seats};}
  const k=Math.max(1,+t.kg||10); return {label:'Custom '+k+' kg total',kg:k,capKg:k*.88,tareKg:+(k*.12).toFixed(1),cabin:k/Math.max(1,seats)<=10};
}
function groupCtx(t){
  const s=Date.parse(t.start), e=Date.parse(t.end);
  const n=s&&e&&e>=s?Math.round((e-s)/864e5):0, d=n+1;
  const P=new Set(t.purpose), T=new Set(t.transport);
  const cap={light:3,balanced:5,prepared:7}[t.style]||5;
  const ages={adult:0,teen:0,child:0,baby:0}; state.people.forEach(p=>ages[p.age]++);
  const seats=state.people.length-ages.baby;
  const lo=+t.low, hi=+t.high, cl=t.climate||{};
  const devices=state.people.filter(p=>p.needs.includes('phone')).length+state.people.filter(p=>p.needs.includes('laptop')).length+state.people.filter(p=>p.needs.includes('photo')).length;
  return {nights:n,d,cd:Math.max(1,t.laundry?Math.min(d,cap):d),P,T,
    n:state.people.length,na:ages.adult,nt:ages.teen,nk:ages.child,nb:ages.baby,minors:ages.teen+ages.child+ages.baby,grownN:ages.adult+ages.teen,seats,devices,
    hot:hi>=28,warm:hi>=22,cool:lo<12,cold:lo<5,freezing:lo<=0,
    rain:t.rain!=='dry',wet:t.rain==='wet',snow:!!t.snow,humid:t.humidity==='high',uv:t.uv==='high'||t.uv==='extreme',
    intl:!!t.intl,flight:T.has('flight')||T.has('longhaul'),longhaul:T.has('longhaul'),cabin:!!lug(t,Math.max(1,seats)).cabin,
    stay:t.stay,style:t.style,laundry:!!t.laundry,gifts:!!t.gifts,plug:cl.plug,voltage:cl.voltage,currency:cl.currency};
}
function personCtx(g,p){
  const P=new Set([...g.P].filter(x=>!(p.skip||[]).includes(x)));
  const casual=['leisure','city','beach','hike','ski','camping','study','competition','family','backpack','cruise','religious','remote','wedding'];
  const biz=P.has('business')||P.has('conference');
  const a=p.age;
  return {...g,P,F:new Set(p.needs||[]),biz,bizOnly:biz&&!casual.some(k=>P.has(k)),
    adult:a==='adult',teen:a==='teen',child:a==='child',baby:a==='baby',grown:a==='adult'||a==='teen',minor:a!=='adult',
    wf:{adult:1,teen:.9,child:.6,baby:.35}[a]||1,wm:{few:.75,some:1,lots:1.35}[p.wardrobe]||1,groom:p.grooming||'basic',hair:p.hair||'short'};
}

/* Build the list and fit it into the group's weight allowance:
   essentials (and anything forced on) first, then recommended, then optional, while weight remains. */
function build(){
  const t=state.trip, g=groupCtx(t), list=[];
  const people=state.people.map((p,i)=>({p,i,name:pname(p,i),c:personCtx(g,p)}));
  for(const [sc,id,n,cat,gr,pr,q,cond,why,o] of C){
    const ok=c=>cond===true||cond(c), ov=state.ov[id]||{};
    if(sc==='s'){
      if(!ok(g)) continue;
      const qq=ov.q||Math.max(1,Math.round(R(q,g)));
      list.push({id,name:R(n,g),cat,p:R(pr,g),q:qq,why:R(why,g)||'',wear:!!o?.wear,free:!!o?.free,who:null,unit:R(gr,g),w:R(gr,g)*qq});
    }else{
      const who=[]; let first=null, p=3, w=0;
      for(const x of people){ if(!ok(x.c)) continue;
        const qq=Math.max(1,Math.round(R(q,x.c))+(ov.d||0)), u=R(gr,x.c);
        who.push({pid:x.p.pid,name:x.name,q:qq}); w+=u*qq; p=Math.min(p,R(pr,x.c)); first??=x.c; }
      if(!who.length) continue;
      list.push({id,name:R(n,first),cat,p,q:who.reduce((a,x)=>a+x.q,0),why:R(why,first)||'',wear:!!o?.wear,free:!!o?.free,who,w});
    }
  }
  (t.climate?.for===climateKey(t)?t.climate.extras||[]:[]).forEach(x=>list.push({id:'x-'+slug(x.name),name:x.name,cat:'ext',p:2,q:1,why:x.why||'',who:null,w:200}));
  state.custom.forEach(x=>list.push({id:x.id,name:x.name,cat:'own',realCat:x.realCat,p:1,q:state.ov[x.id]?.q||1,why:'',who:null,w:(x.g||0)*(state.ov[x.id]?.q||1)}));
  for(const it of list) if(it.wear||it.free){ it.wornW=it.wear?it.w:0; it.w=0; }
  const L=lug(t,g.seats), cap=Math.round(L.capKg*1000);
  let used=0;
  for(const it of list){const o=state.ov[it.id]||{};
    if(o.on===false) it.st='off'; else if(o.on===true||it.p===1){it.st='on';used+=it.w;}}
  for(const p of [2,3]) for(const it of list) if(!it.st&&it.p===p){
    if(!it.w||used+it.w<=cap){it.st='on';used+=it.w;} else it.st='nofit';}
  return {g,L,cap,used,worn:list.filter(i=>i.st==='on').reduce((a,i)=>a+(i.wornW||0),0),list,people};
}

      if(state.hidePacked&&allDone) return '';

  const pack=state.view==='pack'&&state.confirmed;
  $('#planView').hidden=!!pack; $('#packView').hidden=!pack;
  $('#tabPlan').setAttribute('aria-selected',String(!pack)); $('#tabPack').setAttribute('aria-selected',String(!!pack));
  $('#tabPack').disabled=!state.confirmed;
  pack?renderPack():renderReview(b);
}

/* ================= saving (device + signed-in Claude account when available) ================= */
let dbDoc=null, writing=false, pending=false, saveT;
const setSync=s=>$('#sync').textContent=s;
async function flush(){
  if(!dbDoc) return; if(writing){pending=true;return}
  writing=true;
  try{await dbDoc.set({json:JSON.stringify(state),savedAt:state.savedAt}); setSync('Saved to your account');}
  catch(e){setSync('Saved on this device');}
  writing=false; if(pending){pending=false;flush();}
}
function save(){
  state.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  clearTimeout(saveT); saveT=setTimeout(flush,900);
}
const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
(async()=>{
  const [db,user]=await Promise.all([use('db'),use('user')]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  dbDoc=db.collection('data/users/'+id).doc('packing-v2');
  try{
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data(); if((d.savedAt||0)>(state.savedAt||0)){state=merge(JSON.parse(d.json)); fillForm(); render();}}
    else if(!state.example) flush();
    setSync('Synced to your account');
  }catch(e){}
})();

/* ================= weather lookup =================
   Inside Claude: ask Claude for climate normals (the artifact cannot reach weather APIs).
   Standalone: Open-Meteo live forecast if the trip starts within 15 days, else the same dates in the previous 3 years. */
const classify=x=>({
  rain:x.rainPct<20?'dry':x.rainPct<45?'some':'wet',
  humidity:x.humidityPct>=75?'high':x.humidityPct<45?'low':'moderate',
  uv:x.uvIndex<3?'low':x.uvIndex<6?'moderate':x.uvIndex<8?'high':'extreme'});
let lookupSeq=0;
async function lookup(){
  const t=state.trip, msg=$('#lookupMsg'), btn=$('#lookup'), seq=++lookupSeq;
  if(!t.dest||!t.start||!t.end||t.end<t.start){msg.textContent='Enter a destination and both dates to look up the weather.';return;}
  btn.disabled=true; msg.textContent='Looking up weather for '+t.dest+'…';
  try{
    const sample=window.claude?await use('sample'):null;
    let r;
    if(sample) r=await askClaude(sample,t);
    else if(window.claude){ msg.textContent='Weather lookup needs a signed-in Claude viewer. Adjust the weather by hand below.'; $('#adjust').open=true; return; }
    else r=await openMeteo(t);
    if(seq!==lookupSeq) return;
    applyClimate(r);
    msg.textContent=r.forecast?'Live forecast filled in.':'Typical weather for these dates filled in.';
  }catch(e){
    if(seq!==lookupSeq) return;
    msg.textContent=e?.code==='not_found'?'Could not find "'+t.dest+'". Try just the city name.'
      :e?.code==='not_granted'?'Weather lookup was not allowed. Adjust the weather by hand below.'
      :e?.code==='rate_limited'?'Too many lookups just now. Try again in a minute.'
      :'Could not get the weather. Try again, or adjust it by hand below.';
  }finally{ if(seq===lookupSeq) btn.disabled=false; }
}
async function askClaude(sample,t){
  return sample.json(`You are a travel climate assistant. Trip from "${t.home||'unknown'}" to "${t.dest}", ${t.start} to ${t.end}.
Use climate normals for those dates and that place (not a live forecast). Reply with only a JSON object:
{"place": normalised destination "City, Country",
 "code": 3-letter IATA code of the destination's main airport or city, "homeCode": same for the origin, or "",
 "international": true if the trip crosses a national border,
 "lowC": typical night low °C, "highC": typical day high °C,
 "rainPct": typical % of days with at least 1 mm of rain, "humidityPct": typical mean relative humidity %,
 "uvIndex": typical daily maximum UV index, "snow": true if snow or ice is likely,
 "summary": one short sentence on the typical weather for those dates,
 "plug": plug types e.g. "Type A/B", "voltage": e.g. "100 V", "currency": ISO code e.g. "JPY",
 "tips": up to 3 short practical packing tips specific to this place and season,
 "extras": up to 5 objects {"name": short item to pack, "why": under 12 words} specific to this destination, not generic travel items}`,{modelTier:'default'})
    .then(r=>({...r,source:'Climate normals from Claude'}));
}
async function openMeteo(t){
  const getJson=async u=>{const r=await fetch(u); const j=await r.json(); if(!r.ok||j.error) throw new Error(j.reason||r.status); return j;};
  const geo=async q=>q?(await getJson('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q.split(',')[0].trim()))).results?.[0]:null;
  const [d,h]=await Promise.all([geo(t.dest),geo(t.home).catch(()=>null)]);
  if(!d) throw {code:'not_found'};
  const vars='temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,relative_humidity_2m_mean,uv_index_max';
  const iso=ms=>new Date(ms).toISOString().slice(0,10);
  const today=iso(Date.now()), horizon=iso(Date.now()+15*864e5);
  const days=Math.min(31,Math.round((Date.parse(t.end)-Date.parse(t.start))/864e5)+1);
  const loc=`latitude=${d.latitude}&longitude=${d.longitude}&timezone=auto`;
  let runs, forecast=false, source;
  if(t.start>=today&&t.start<=horizon){
    const end=t.end<horizon?t.end:horizon;
    runs=[(await getJson(`https://api.open-meteo.com/v1/forecast?${loc}&start_date=${t.start}&end_date=${end}&daily=${vars},precipitation_probability_max`)).daily];
    forecast=true; source=`Forecast for ${fmtD(t.start)} – ${fmtD(end)}`+(end<t.end?' (later days not forecast yet)':'');
  }else{
    const y=+t.start.slice(0,4), shift=k=>(y-k)+t.start.slice(4).replace('-02-29','-02-28');
    const res=await Promise.allSettled([1,2,3].map(k=>{const s=shift(k);
      return getJson(`https://historical-forecast-api.open-meteo.com/v1/forecast?${loc}&start_date=${s}&end_date=${iso(Date.parse(s)+(days-1)*864e5)}&daily=${vars}`).then(j=>({y:y-k,d:j.daily}));}));
    const ok=res.filter(r=>r.status==='fulfilled').map(r=>r.value);
    if(!ok.length) throw new Error('no data');
    runs=ok.map(o=>o.d); source='Same dates in '+ok.map(o=>o.y).sort().join(', ');
  }
  const all=k=>runs.flatMap(r=>r[k]||[]).filter(v=>v!=null);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
  const pct=(a,f)=>a.length?100*a.filter(f).length/a.length:NaN;
  const rainPct=forecast&&all('precipitation_probability_max').length?avg(all('precipitation_probability_max')):pct(all('precipitation_sum'),v=>v>=1);
  return {place:d.name+(d.country?', '+d.country:''),code:code(d.name),homeCode:h?code(h.name):'',
    international:h?h.country_code!==d.country_code:t.intl,
    lowC:avg(all('temperature_2m_min')),highC:avg(all('temperature_2m_max')),rainPct,
    humidityPct:avg(all('relative_humidity_2m_mean')),uvIndex:avg(all('uv_index_max')),
    snow:pct(all('snowfall_sum'),v=>v>.5)>(forecast?0:10),forecast,source,summary:'',plug:'',voltage:'',currency:'',tips:[],extras:[]};
}
function applyClimate(r){
  const t=state.trip, num=(v,d)=>Number.isFinite(+v)&&v!==null&&v!==''?+v:d;
  const x={lowC:num(r.lowC,t.low),highC:num(r.highC,t.high),rainPct:num(r.rainPct,NaN),humidityPct:num(r.humidityPct,NaN),uvIndex:num(r.uvIndex,NaN)};
  const k=classify(x);
  Object.assign(t,{low:Math.round(x.lowC),high:Math.round(x.highC),snow:!!r.snow,
    rain:Number.isFinite(x.rainPct)?k.rain:t.rain,humidity:Number.isFinite(x.humidityPct)?k.humidity:t.humidity,uv:Number.isFinite(x.uvIndex)?k.uv:t.uv,
    intl:typeof r.international==='boolean'?r.international:t.intl});
  t.climate={for:climateKey(t),place:String(r.place||t.dest),code:String(r.code||'').slice(0,4).toUpperCase(),homeCode:String(r.homeCode||'').slice(0,4).toUpperCase(),
    source:String(r.source||''),forecast:!!r.forecast,summary:String(r.summary||''),...x,
    plug:String(r.plug||''),voltage:String(r.voltage||''),currency:String(r.currency||''),
    tips:(Array.isArray(r.tips)?r.tips:[]).slice(0,3).map(String),
    extras:(Array.isArray(r.extras)?r.extras:[]).slice(0,5).filter(x=>x&&x.name).map(x=>({name:String(x.name),why:String(x.why||'')}))};
  state.example=false;
  fillForm(); render(); save();
}
let autoT;
function autoLookup(){ clearTimeout(autoT); autoT=setTimeout(()=>{const t=state.trip; if(t.climate?.for!==climateKey(t)) lookup();},1200); }

/* ================= export ================= */
const lineFor=i=>`${i.name}${i.who?' — '+whoText(i):(i.q>1?' × '+i.q:'')}`;
function asText(){
  const t=state.trip, list=state.confirmed||[];
  const groups={}; list.forEach(i=>(groups[i.cat]??=[]).push(i));
  return `PACKING LIST · ${t.dest} · ${fmtD(t.start)} – ${fmtD(t.end)} · ${groupSummary()}\n`+Object.entries(CATS).filter(([k])=>groups[k]).map(([k,l])=>
    `\n${l.toUpperCase()}\n`+groups[k].map(i=>`[${keysOf(i).every(x=>state.packed[x])?'x':' '}] ${lineFor(i)}`).join('\n')).join('\n');
}
function printable(){
  const t=state.trip, list=state.confirmed||[];
  const groups={}; list.forEach(i=>(groups[i.cat]??=[]).push(i));
  return `<!doctype html><html><head><meta charset="utf-8"><title>Packing list · ${esc(t.dest)}</title><style>
body{font:13px/1.45 Arial,sans-serif;color:#111;margin:18mm}h1{font-size:22px;margin:0}p{margin:4px 0 14px;color:#444}
.cols{columns:2;column-gap:10mm}.g{break-inside:avoid;margin-bottom:10px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1.5px solid #111;padding-bottom:2px;margin:0 0 4px}
.i{padding:3px 0;border-bottom:1px dotted #bbb}.i>div{display:flex;gap:8px}.b{width:11px;height:11px;border:1.5px solid #111;flex:none;margin-top:2px;display:inline-block}.q{margin-left:auto;color:#555}
.w{display:flex;flex-wrap:wrap;gap:4px 12px;padding:2px 0 0 19px;color:#333;font-size:12px}.w span{display:inline-flex;gap:5px;align-items:center}.w .b{width:9px;height:9px;margin:0}
@page{margin:0}</style></head><body><h1>Packing list · ${esc(t.dest)}</h1><p>${fmtD(t.start)} – ${fmtD(t.end)} · ${esc(groupSummary())} · ${list.length} items</p><div class="cols">`+
  Object.entries(CATS).filter(([k])=>groups[k]).map(([k,l])=>`<div class="g"><h2>${l}</h2>`+groups[k].map(i=>
    i.who&&i.who.length>1
      ?`<div class="i"><div><span>${esc(i.name)}</span><span class="q">× ${i.q}</span></div><div class="w">${i.who.map(w=>`<span><span class="b"></span>${esc(w.name)}${w.q>1?' × '+w.q:''}</span>`).join('')}</div></div>`
      :`<div class="i"><div><span class="b"></span><span>${esc(i.name)}${i.who?' ('+esc(i.who[0].name)+')':''}</span><span class="q">${i.q>1?'× '+i.q:''}</span></div></div>`).join('')+'</div>').join('')+
  `</div><script>window.onload=function(){window.print()}<\/script></body></html>`;
}

/* ================= events ================= */
buildForm(); fillForm(); render();
if(state.trip.climate?.for!==climateKey(state.trip)) autoLookup();

$('#trip').addEventListener('input',e=>{
  if(e.target.closest('#people')) return;
  const before=state.trip.purpose.join();
  readForm(); state.example=false; syncFormBits();
  if(state.trip.purpose.join()!==before) renderPeople();
  render(); save();
  if(['dest','start','end','home'].includes(e.target.dataset.k)) autoLookup();
});
$('#trip').addEventListener('submit',e=>e.preventDefault());
$('#lookup').addEventListener('click',lookup);

// travellers
$('#trip').addEventListener('click',e=>{
  const add=e.target.closest('[data-add]'), rm=e.target.closest('[data-remove]');
  if(add){ const age=add.dataset.add, n=state.people.filter(p=>p.age===age).length+1;
    state.people.push({...newPerson(age),name:label('age',age).split(' ')[0]+' '+n}); state.example=false; renderPeople(); render(); save();
    $$('.person').at(-1)?.querySelector('input[type=text]')?.focus(); }
  if(rm&&state.people.length>1){ state.people=state.people.filter(p=>p.pid!==rm.dataset.remove); state.example=false; renderPeople(); render(); save(); }
});
$('#trip').addEventListener('input',e=>{
  const card=e.target.closest('.person'); if(!card) return;
  const p=state.people.find(x=>x.pid===card.dataset.pid), f=e.target.dataset.pf; if(!p||!f) return;
  if(f==='name') p.name=e.target.value;
  else if(f==='age'){ if(e.target.checked) p.age=e.target.value; $('#peopleCount').textContent=groupSummary(); }
  else if(f==='needs'){ p.needs=$$('[data-pf="needs"]:checked',card).map(x=>x.value); card.querySelector('summary .count').textContent=p.needs.length+' selected'; }
  else if(f==='join') p.skip=$$('[data-pf="join"]',card).filter(x=>!x.checked).map(x=>x.value);
  else p[f]=e.target.value;
  state.example=false; render(); save();
});

// review list
$('#review').addEventListener('change',e=>{
  const id=e.target.dataset.inc; if(!id) return;
  (state.ov[id]??={}).on=e.target.checked; render(); save();
});
$('#review').addEventListener('click',e=>{
  const q=e.target.closest('[data-q]'), del=e.target.closest('[data-del]');
  if(q){const it=last.list.find(i=>i.id===q.dataset.q), o=(state.ov[it.id]??={}), d=+q.dataset.d;
    if(it.who){ const minQ=Math.min(...it.who.map(w=>w.q)); if(d<0&&minQ<=1) return; o.d=(o.d||0)+d; }
    else o.q=Math.max(1,it.q+d);
    render(); save();}
  if(del){e.preventDefault(); state.custom=state.custom.filter(x=>x.id!==del.dataset.del); render(); save();}
});
$('#review').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#own-name').value.trim(); if(!name) return;
  const cat=$('#own-cat').value, g=Math.max(0,+$('#own-g').value||0);
  state.custom.push({id:'u-'+Date.now().toString(36),name,g,realCat:cat==='own'?null:cat});
  render(); save(); $('#own-name')?.focus();
});
$('#resetOv').addEventListener('click',()=>{state.ov={}; render(); save();});
$('#confirm').addEventListener('click',()=>{
  state.confirmed=last.list.filter(i=>i.st==='on').map(i=>({id:i.id,name:i.name,cat:i.realCat||i.cat,q:i.q,wear:i.wear,who:i.who}));
  const keys=new Set(state.confirmed.flatMap(keysOf));
  for(const k in state.packed) if(!keys.has(k)) delete state.packed[k];
  state.view='pack'; render(); save(); window.scrollTo({top:0});
});
$('#tabPlan').addEventListener('click',()=>{state.view='plan'; render(); save();});
$('#tabPack').addEventListener('click',()=>{if(!state.confirmed) return; state.view='pack'; render(); save();});

// pack view
$('#packList').addEventListener('change',e=>{
  const k=e.target.dataset.pk; if(!k) return;
  if(e.target.checked) state.packed[k]=true; else delete state.packed[k];
  renderPack(); save();
});
$('#packWho').addEventListener('change',e=>{state.packWho=e.target.value; renderPack(); save();});
$('#hidePacked').addEventListener('change',e=>{state.hidePacked=e.target.checked; renderPack(); save();});
let untickArmed;
$('#untick').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(!untickArmed){untickArmed=setTimeout(()=>{untickArmed=null;b.textContent='Untick all';},3000); b.textContent='Click again to untick all'; return;}
  clearTimeout(untickArmed); untickArmed=null; b.textContent='Untick all';
  state.packed={}; renderPack(); save();
});
$('#copyText').addEventListener('click',e=>{
  const b=e.currentTarget, txt=asText();
  const done=m=>{b.textContent=m; setTimeout(()=>b.textContent='Copy as text',2000);};
  try{navigator.clipboard.writeText(txt).then(()=>done('Copied'),()=>fallback());}catch(err){fallback();}
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;height:200px;margin-top:10px';$('#packNote').after(ta);ta.select();done('Select and copy the text below');}
});
// Inside Claude the frame cannot print, so offer a printable file; standalone, just print.
const dlReady=use('downloads');
dlReady.then(d=>{if(!d){ if(window.claude) $('#dlPrint').hidden=true; else $('#dlPrint').textContent='Print list'; }});
$('#dlPrint').addEventListener('click',async e=>{
  const b=e.currentTarget, d=await dlReady;
  if(!d){ if(!window.claude) window.print(); return; }
  try{await d.save({filename:'packing-list-'+slug(state.trip.dest)+'.html',data:printable()}); b.textContent='Saved. Open it to print';}
  catch(err){b.textContent=err?.code==='declined'?'Download printable list':'Download not available here';}
  setTimeout(()=>b.textContent='Download printable list',4000);
});
</script>
